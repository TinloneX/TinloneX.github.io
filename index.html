    :root {
      --cyan: #00f0ff;
      --purple: #b347ea;
      --magenta: #ff2d95;

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;min-height:100vh;overflow-x:hidden;color:#d0ecff;background:var(--bg);font-family:"Orbitron","PingFang SC","Microsoft YaHei",sans-serif}

    /* ── Canvas ── */

    /* ── Overlays ── */
    body::after{content:"";position:fixed;inset:0;z-index:998;pointer-events:none;

      mask-image:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.35) 100%)}
    body::before{content:"";position:fixed;inset:0;z-index:997;pointer-events:none;
      background:radial-gradient(ellipse at 50% 48%,rgba(0,240,255,.03) 0%,transparent 45%,rgba(0,0,0,.5) 100%)}

    /* ── Layout ── */
    main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}

    /* ── Title ── */
    .glitch-wrap{text-align:center;margin-bottom:clamp(6px,1.5vh,18px)}
    .glitch{font-size:clamp(2rem,7vw,5.5rem);font-weight:900;letter-spacing:.14em;position:relative;display:inline-block;color:var(--cyan);text-shadow:0 0 12px var(--cyan),0 0 50px rgba(0,240,255,.5),0 0 100px rgba(0,240,255,.2);user-select:none;line-height:1}
    .glitch::before,.glitch::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;height:100%}
    .glitch::before{color:var(--magenta);text-shadow:-3px 0 var(--magenta);animation:g1 3.5s steps(1) infinite;clip-path:polygon(0 15%,100% 10%,100% 32%,0 38%)}
    .glitch::after{color:var(--purple);text-shadow:3px 0 var(--purple);animation:g2 2.8s steps(1) infinite;clip-path:polygon(0 63%,100% 68%,100% 88%,0 78%)}
    @keyframes g1{0%,91%,100%{transform:translate(0)}92.5%{transform:translate(-3px,1px)}94.5%{transform:translate(3px,0)}96%{transform:translate(0)}}
    @keyframes g2{0%,87%,100%{transform:translate(0)}88.5%{transform:translate(4px,-1px)}90.5%{transform:translate(-2px,2px)}92%{transform:translate(0)}}
    .sub-tag{display:block;margin-top:6px;font-size:clamp(.62rem,1.5vw,.88rem);letter-spacing:.32em;color:rgba(0,240,255,.45)}

    /* ── Core ── */
    .core{position:relative;width:clamp(280px,62vw,600px);aspect-ratio:1;margin:0 auto;display:flex;align-items:center;justify-content:center}
    /* -- Hex frames -- */
    .fx{position:absolute;inset:0;clip-path:polygon(50% 3%,95% 25%,95% 75%,50% 97%,5% 75%,5% 25%);pointer-events:none}
    .fx::after{content:"";position:absolute;inset:2px;clip-path:polygon(50% 3%,95% 25%,95% 75%,50% 97%,5% 75%,5% 25%)}
    .fx.a{z-index:1;animation:spin 18s linear infinite}
    .fx.a::after{background:conic-gradient(from 0deg,rgba(0,240,255,0),rgba(0,240,255,.12),rgba(0,240,255,0))}
    .fx.b{inset:8%;z-index:3;animation:spin 28s linear infinite reverse}
    .fx.b::after{background:conic-gradient(from 90deg,transparent,rgba(179,71,234,.10),transparent);box-shadow:inset 0 0 40px rgba(179,71,234,.06)}
    .fx.c{inset:16%;z-index:2;animation:spin 22s linear infinite;border:1px solid rgba(0,240,255,.15)}
    .fx.c::after{inset:0;background:transparent;border:1px dashed rgba(0,240,255,.12);animation:dash-rot .8s linear infinite}
    @keyframes spin{to{rotate:360deg}}
    @keyframes dash-rot{to{rotate:180deg}}
    /* -- Energy beams -- */
    .beam{position:absolute;width:1px;height:46%;background:linear-gradient(to top,transparent,rgba(0,240,255,.25),transparent);pointer-events:none;transform-origin:bottom center;bottom:50%}
    .beam:nth-child(1){rotate:0deg;animation:beam-sweep 12s linear infinite}
    .beam:nth-child(2){rotate:60deg;animation:beam-sweep 12s linear infinite 4s}
    .beam:nth-child(3){rotate:120deg;animation:beam-sweep 12s linear infinite 8s}
    @keyframes beam-sweep{0%{opacity:.6}50%{opacity:0}100%{opacity:.6}}
    /* -- Core spark -- */
    .spark{position:relative;z-index:4;width:clamp(14px,3vw,28px);height:clamp(14px,3vw,28px);border-radius:50%;background:var(--cyan);box-shadow:0 0 20px var(--cyan),0 0 50px rgba(0,240,255,.8),0 0 100px rgba(0,240,255,.4),0 0 160px rgba(0,240,255,.15);animation:spark-pulse 2.4s ease-in-out infinite}
    @keyframes spark-pulse{0%,100%{scale:1;opacity:.9}50%{scale:1.6;opacity:1}}
    /* -- Accretion ring -- */
    .acc{position:absolute;inset:26%;border-radius:50%;pointer-events:none;z-index:2;border:2px solid transparent;animation:spin 8s linear infinite}
    .acc::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid rgba(0,240,255,.3);border-top-color:var(--cyan);box-shadow:0 0 12px rgba(0,240,255,.25);animation:spin 4s linear infinite}
    /* -- Orbit dots -- */
    .dots{position:absolute;inset:20%;pointer-events:none;animation:spin 16s linear infinite}
    .dots i{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
    .dots i:nth-child(1){top:0;left:50%}
    .dots i:nth-child(2){top:50%;right:0;background:var(--purple);box-shadow:0 0 6px var(--purple)}
    .dots i:nth-child(3){bottom:0;left:50%}
    .dots i:nth-child(4){top:50%;left:0;background:var(--magenta);box-shadow:0 0 6px var(--magenta)}
    .dots i:nth-child(5){top:15%;right:15%;width:2px;height:2px}
    .dots i:nth-child(6){bottom:15%;left:15%;width:2px;height:2px}

    /* ── Nodes ── */
    .node{position:absolute;left:50%;top:50%;display:flex;flex-direction:column;align-items:center;text-decoration:none;color:inherit;transition:filter .3s;transform-origin:0 0;cursor:pointer}
    .node:hover{filter:brightness(1.8);z-index:10}
    .node:hover .hex{scale:1.22}
    .hex{width:clamp(48px,8vw,72px);height:clamp(56px,9vw,84px);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);position:relative;transition:scale .25s}
    .b{background:linear-gradient(135deg,rgba(0,240,255,.3),rgba(0,160,210,.1));border:1.5px solid rgba(0,240,255,.45);box-shadow:0 0 22px rgba(0,240,255,.35),inset 0 0 22px rgba(0,240,255,.10)}
    .m{background:linear-gradient(135deg,rgba(255,45,149,.3),rgba(180,20,90,.1));border:1.5px solid rgba(255,45,149,.45);box-shadow:0 0 22px rgba(255,45,149,.35),inset 0 0 22px rgba(255,45,149,.10)}
    .p{background:linear-gradient(135deg,rgba(179,71,234,.3),rgba(120,40,170,.1));border:1.5px solid rgba(179,71,234,.45);box-shadow:0 0 22px rgba(179,71,234,.35),inset 0 0 22px rgba(179,71,234,.10)}
    .node-tag{position:absolute;bottom:-26px;font-size:clamp(.58rem,1.1vw,.78rem);letter-spacing:.14em;padding:2px 8px;white-space:nowrap;background:rgba(0,18,30,.85);border:1px solid rgba(0,240,255,.12);border-radius:2px;transition:all .25s}
    .node:hover .node-tag{border-color:rgba(0,240,255,.4);text-shadow:0 0 10px var(--cyan);color:#fff}

    /* ── Cards ── */
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:clamp(300px,88vw,860px);margin-top:clamp(20px,3vh,36px)}
    .card{position:relative;padding:16px 14px;background:rgba(0,12,22,.7);border:1px solid rgba(0,240,255,.1);border-radius:4px;text-decoration:none;color:inherit;transition:all .3s;overflow:hidden;backdrop-filter:blur(8px)}
    .card::before{content:"";position:absolute;top:0;left:15%;right:15%;height:1px;transition:all .3s}
    .card:hover{transform:translateY(-3px);border-color:rgba(0,240,255,.25);box-shadow:0 10px 35px rgba(0,0,0,.45),0 0 25px rgba(0,240,255,.06)}
    .card:hover::before{left:0;right:0}
    .card:nth-child(1)::before{background:var(--cyan)}
    .card:nth-child(2)::before{background:var(--magenta)}
    .card:nth-child(3)::before{background:var(--purple)}
    .card-tag{display:inline-block;font-size:.62rem;letter-spacing:.18em;padding:2px 7px;border-radius:2px;margin-bottom:8px}
    .ct-cyan{color:var(--cyan);background:rgba(0,240,255,.1);border:1px solid rgba(0,240,255,.18)}
    .ct-mag{color:var(--magenta);background:rgba(255,45,149,.1);border:1px solid rgba(255,45,149,.18)}
    .ct-pur{color:var(--purple);background:rgba(179,71,234,.1);border:1px solid rgba(179,71,234,.18)}
    .card h3{margin:0 0 5px;font-size:.95rem;font-weight:500;letter-spacing:.05em}
    .card p{font-size:.72rem;color:rgba(180,215,235,.55);line-height:1.55;font-family:"PingFang SC","Microsoft YaHei",sans-serif}

    .hint{margin-top:18px;font-size:.65rem;letter-spacing:.22em;color:rgba(0,240,255,.25);font-family:"PingFang SC","Microsoft YaHei",sans-serif}

    /* ── Responsive ── */
    @media(max-width:768px){
      .cards{grid-template-columns:1fr;max-width:380px}
    }
    @media(max-width:480px){
      .hex{width:38px;height:44px}
      .node-tag{bottom:-20px;font-size:.55rem}
    }
    @media(prefers-reduced-motion:reduce){
      .fx,.spark,.acc,.dots,.beam,.node *,*::before,*::after{animation:none!important}
    }
  </style>

            if(py < -20 || py > H+20) continue;
            const ch = BLOG[(d.off + j) % BL];
            const t = j===0?1:Math.pow(.84,j);
            ctx.fillStyle = `hsla(${d.hue},92%,68%,${t})`;
            ctx.fillText(ch, d.x, py);
          }
        }
      }

      /* ── Grid ── */
      function drawGrid(){
        const s=80, cx=W/2, cy=H*.47;
        ctx.strokeStyle='rgba(0,240,255,.025)'; ctx.lineWidth=.5; ctx.beginPath();
        for(let x=cx%s;x<W;x+=s){ctx.moveTo(x,0);ctx.lineTo(x,H)}
        for(let y=cy%s;y<H;y+=s){ctx.moveTo(0,y);ctx.lineTo(W,y)}
        ctx.stroke();
      }

      /* ── Loop ── */
      let lastT = 0;
      function frame(ts){
        const dt = lastT ? Math.min((ts-lastT)/1000,.1) : .016; lastT=ts;
        ctx.fillStyle='rgba(2,5,8,.18)'; ctx.fillRect(0,0,W,H);
        drawGrid();
        drawRain();
        tickOrbits(dt);
        requestAnimationFrame(frame);
      }

      function measure(){
        W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight;
        initDrops(); placeOrbits();
      }

      /* ── Orbits ── */
      const nodes=[];
      document.querySelectorAll('.node').forEach(el=>{
        const rVw=parseFloat(el.dataset.orbit)||24;
        const a0=(parseFloat(el.dataset.angle)||0)*Math.PI/180;
        const T=parseFloat(el.dataset.speed)||30;
        nodes.push({el,rv:rVw,angle:a0,spd:2*Math.PI/T});
      });

      function placeOrbits(){
        for(const n of nodes){
          const r=n.rv/100*W, x=Math.cos(n.angle)*r, y=Math.sin(n.angle)*r;
          n.el.style.transform=`translate(${x}px,${y}px)`;
        }
      }
      function tickOrbits(dt){
        for(const n of nodes){n.angle+=n.spd*dt}
        placeOrbits();
      }

      measure(); requestAnimationFrame(frame);
      window.addEventListener('resize', measure);
    })();
  </script>
</body>
</html>
