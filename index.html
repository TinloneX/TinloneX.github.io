<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TinloneX | Cyberpunk Gateway</title>
  <meta name="description" content="TinloneX 的赛博朋克入口页，通往博客、NoBTI 与创意工坊。">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="TinloneX | Cyberpunk Gateway">
  <meta property="og:description" content="TinloneX 的赛博朋克入口页，通往博客、NoBTI 与创意工坊。">
  <meta property="og:image" content="https://tinlone.com/logo.jpg">
  <meta property="og:url" content="https://tinlone.com/">
  <meta property="og:site_name" content="TinloneX">
  <meta property="og:locale" content="zh_CN">
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="TinloneX | Cyberpunk Gateway">
  <meta name="twitter:description" content="TinloneX 的赛博朋克入口页，通往博客、NoBTI 与创意工坊。">
  <meta name="twitter:image" content="https://tinlone.com/logo.jpg">
  <!-- Canonical -->
  <link rel="canonical" href="https://tinlone.com/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #00f0ff;
      --purple: #b347ea;
      --magenta: #ff2d95;
      --bg: #020508;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;min-height:100vh;overflow-x:hidden;color:#d0ecff;background:var(--bg);font-family:"Orbitron","PingFang SC","Microsoft YaHei",sans-serif}

    /* ── Canvas ── */
    canvas#bg{position:fixed;inset:0;z-index:0;pointer-events:none}

    /* ── Overlays ── */
    body::after{content:"";position:fixed;inset:0;z-index:998;pointer-events:none;
      background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.04) 2px,rgba(0,0,0,.04) 4px);
      mask-image:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.35) 100%)}
    body::before{content:"";position:fixed;inset:0;z-index:997;pointer-events:none;
      background:radial-gradient(ellipse at 50% 48%,rgba(0,240,255,.03) 0%,transparent 45%,rgba(0,0,0,.5) 100%)}

    /* ── Layout ── */
    main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}

    /* ── Title ── */
    .glitch-wrap{text-align:center;margin-bottom:clamp(6px,1.5vh,18px)}
    .glitch{font-size:clamp(2rem,7vw,5.5rem);font-weight:900;letter-spacing:.14em;position:relative;display:inline-block;color:var(--cyan);text-shadow:0 0 12px var(--cyan),0 0 50px rgba(0,240,255,.5),0 0 100px rgba(0,240,255,.2);user-select:none;line-height:1}
    .glitch::before,.glitch::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;height:100%}
    .glitch::before{color:var(--magenta);text-shadow:-3px 0 var(--magenta);animation:g1 3.5s steps(1) infinite;clip-path:polygon(0 15%,100% 10%,100% 32%,0 38%)}
    .glitch::after{color:var(--purple);text-shadow:3px 0 var(--purple);animation:g2 2.8s steps(1) infinite;clip-path:polygon(0 63%,100% 68%,100% 88%,0 78%)}
    @keyframes g1{0%,91%,100%{transform:translate(0)}92.5%{transform:translate(-3px,1px)}94.5%{transform:translate(3px,0)}96%{transform:translate(0)}}
    @keyframes g2{0%,87%,100%{transform:translate(0)}88.5%{transform:translate(4px,-1px)}90.5%{transform:translate(-2px,2px)}92%{transform:translate(0)}}
    .sub-tag{display:block;margin-top:6px;font-size:clamp(.62rem,1.5vw,.88rem);letter-spacing:.32em;color:rgba(0,240,255,.45)}

    /* ── Core ── */
    .core{position:relative;width:clamp(280px,62vw,600px);aspect-ratio:1;margin:0 auto;display:flex;align-items:center;justify-content:center}
    .ring{position:absolute;border-radius:50%;pointer-events:none}
    .ring.a{inset:32%;border:1.5px solid rgba(0,240,255,.28);box-shadow:0 0 18px rgba(0,240,255,.12),inset 0 0 18px rgba(0,240,255,.05);animation:spin 14s linear infinite}
    .ring.b{inset:22%;border:1px solid rgba(179,71,234,.22);box-shadow:0 0 14px rgba(179,71,234,.10);animation:spin 20s linear infinite reverse;rotate:x 55deg}
    .ring.c{inset:12%;border:1px solid rgba(0,240,255,.14);box-shadow:0 0 10px rgba(0,240,255,.08);animation:spin 26s linear infinite;rotate:x -48deg}
    @keyframes spin{to{rotate:360deg}}
    .diamond{width:clamp(36px,7vw,70px);height:clamp(36px,7vw,70px);background:rgba(0,240,255,.06);border:2px solid rgba(0,240,255,.4);rotate:45deg;box-shadow:0 0 25px rgba(0,240,255,.25),0 0 60px rgba(0,240,255,.1),inset 0 0 18px rgba(0,240,255,.08);animation:d-pulse 3s ease-in-out infinite}
    .diamond::after{content:"";position:absolute;inset:22%;background:rgba(0,240,255,.2);animation:d-inner 2.2s ease-in-out infinite alternate}
    @keyframes d-pulse{0%,100%{box-shadow:0 0 25px rgba(0,240,255,.25),0 0 55px rgba(0,240,255,.08)}50%{box-shadow:0 0 50px rgba(0,240,255,.5),0 0 110px rgba(0,240,255,.22),0 0 180px rgba(179,71,234,.12)}}
    @keyframes d-inner{0%{opacity:.35;scale:.65}100%{opacity:1;scale:1}}

    /* ── Nodes ── */
    .node{position:absolute;left:50%;top:50%;display:flex;flex-direction:column;align-items:center;text-decoration:none;color:inherit;transition:filter .3s;transform-origin:0 0}
    .node:hover{filter:brightness(1.8);z-index:10}
    .node:hover .hex{scale:1.22}
    .hex{width:clamp(48px,8vw,72px);height:clamp(56px,9vw,84px);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);position:relative;transition:scale .25s}
    .b{background:linear-gradient(135deg,rgba(0,240,255,.3),rgba(0,160,210,.1));border:1.5px solid rgba(0,240,255,.45);box-shadow:0 0 22px rgba(0,240,255,.35),inset 0 0 22px rgba(0,240,255,.10)}
    .m{background:linear-gradient(135deg,rgba(255,45,149,.3),rgba(180,20,90,.1));border:1.5px solid rgba(255,45,149,.45);box-shadow:0 0 22px rgba(255,45,149,.35),inset 0 0 22px rgba(255,45,149,.10)}
    .p{background:linear-gradient(135deg,rgba(179,71,234,.3),rgba(120,40,170,.1));border:1.5px solid rgba(179,71,234,.45);box-shadow:0 0 22px rgba(179,71,234,.35),inset 0 0 22px rgba(179,71,234,.10)}
    .node-tag{position:absolute;bottom:-26px;font-size:clamp(.58rem,1.1vw,.78rem);letter-spacing:.14em;padding:2px 8px;white-space:nowrap;background:rgba(0,18,30,.85);border:1px solid rgba(0,240,255,.12);border-radius:2px;transition:all .25s}
    .node:hover .node-tag{border-color:rgba(0,240,255,.4);text-shadow:0 0 10px var(--cyan);color:#fff}

    /* ── Cards ── */
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:clamp(300px,88vw,860px);margin-top:clamp(20px,3vh,36px)}
    .card{position:relative;padding:16px 14px;background:rgba(0,12,22,.7);border:1px solid rgba(0,240,255,.1);border-radius:4px;text-decoration:none;color:inherit;transition:all .3s;overflow:hidden;backdrop-filter:blur(8px)}
    .card::before{content:"";position:absolute;top:0;left:15%;right:15%;height:1px;transition:all .3s}
    .card:hover{transform:translateY(-3px);border-color:rgba(0,240,255,.25);box-shadow:0 10px 35px rgba(0,0,0,.45),0 0 25px rgba(0,240,255,.06)}
    .card:hover::before{left:0;right:0}
    .card:nth-child(1)::before{background:var(--cyan)}
    .card:nth-child(2)::before{background:var(--magenta)}
    .card:nth-child(3)::before{background:var(--purple)}
    .card-tag{display:inline-block;font-size:.62rem;letter-spacing:.18em;padding:2px 7px;border-radius:2px;margin-bottom:8px}
    .ct-cyan{color:var(--cyan);background:rgba(0,240,255,.1);border:1px solid rgba(0,240,255,.18)}
    .ct-mag{color:var(--magenta);background:rgba(255,45,149,.1);border:1px solid rgba(255,45,149,.18)}
    .ct-pur{color:var(--purple);background:rgba(179,71,234,.1);border:1px solid rgba(179,71,234,.18)}
    .card h3{margin:0 0 5px;font-size:.95rem;font-weight:500;letter-spacing:.05em}
    .card p{font-size:.72rem;color:rgba(180,215,235,.55);line-height:1.55;font-family:"PingFang SC","Microsoft YaHei",sans-serif}

    .hint{margin-top:18px;font-size:.65rem;letter-spacing:.22em;color:rgba(0,240,255,.25);font-family:"PingFang SC","Microsoft YaHei",sans-serif}

    /* ── Responsive ── */
    @media(max-width:768px){
      .cards{grid-template-columns:1fr;max-width:380px}
      .ring.b{rotate:x 42deg}.ring.c{rotate:x -38deg}
    }
    @media(max-width:480px){
      .hex{width:38px;height:44px}
      .node-tag{bottom:-20px;font-size:.55rem}
    }
    @media(prefers-reduced-motion:reduce){
      .ring,.diamond,.node *,*::before,*::after{animation:none!important}
    }
  </style>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <main>
    <div class="glitch-wrap">
      <h1 class="glitch" data-text="TINLONEX">TINLONEX</h1>
      <span class="sub-tag">// CYBERPUNK GATEWAY //</span>
    </div>

    <section class="core" aria-label="导航星图">
      <div class="ring a"></div>
      <div class="ring b"></div>
      <div class="ring c"></div>
      <div class="diamond"></div>

      <a class="node" href="/blog.html" aria-label="进入博客" data-orbit="23" data-angle="-30" data-speed="30">
        <div class="hex b"></div>
        <span class="node-tag">BLOG</span>
      </a>
      <a class="node" href="/nobti.html" aria-label="进入 NoBTI" data-orbit="35" data-angle="110" data-speed="38">
        <div class="hex m"></div>
        <span class="node-tag">NoBTI</span>
      </a>
      <a class="node" href="/yinghua.html" aria-label="进入创意工坊" data-orbit="47" data-angle="225" data-speed="46">
        <div class="hex p"></div>
        <span class="node-tag">LAB</span>
      </a>
    </section>

    <div class="cards">
      <a class="card" href="/blog.html">
        <span class="card-tag ct-cyan">ARCHIVE</span>
        <h3>博客星球</h3>
        <p>Android Framework · Jetpack · 性能优化 · 源码分析</p>
      </a>
      <a class="card" href="/nobti.html">
        <span class="card-tag ct-mag">QUIZ</span>
        <h3>NoBTI 测试</h3>
        <p>反性格测试型测试，用伪专业报告认真误读你</p>
      </a>
      <a class="card" href="/yinghua.html">
        <span class="card-tag ct-pur">LAB</span>
        <h3>创意工坊</h3>
        <p>樱花漫游与更多创意实验项目</p>
      </a>
    </div>

    <p class="hint">SELECT A NODE TO CONNECT</p>
  </main>

  <script>
    (function(){
      const canvas = document.getElementById('bg');
      const ctx = canvas.getContext('2d');
      let W, H;

      /* ── Digital Rain ── */
      const TOKENS=`一下|一个组件|一看来创|上之前的|下会|下调用|不常使用|与的|个以|个死|个需要初|中如果|中的字|为例事|为最|主要的|么都|也为我们|了单例|了解了使|于为每个|于配置|享单个|从上游|他是如何|代码目录|以中通|以安全|以达到|们大胆|们要|件元数|件机|任务串|任意地方|会执行由|似乎在|何使用|作取消|作生|你感兴趣|使用源|供了更|保任|值并未作|停留在它|先检查清|入队|关系依|其在前台|内存中|再连接|几句话我|击事件触|分这|则取自|创建时|别的代|到更|制执行|前有覆|加了注解|务列表|务的|动发生了|动的自|化前面|化这些组|单只|即接|原的对|及时回收|发我|取中的|变化应用|可以发现|可知在|各部分介|同的生命|后续事宜|否则将|启动和退|周期有|命周期管|和翻译|器实例|回想|图整体|在停止|在方法中|在重建屏|型及其一|处不做赘|处理生命|复观|头部元素|如果设|始化首先|存分|存活十|它设置|定义共享|实现了|察值的作|对做弱引|对象的的|将你实现|小事情|层类旨|工作只|带来更|并合并|序列|应内部|度指定|开关|引入依|当我们|影及均|循环电影|态在符|思考如|您要运行|意我|成本无|我们来画|或无可消|托去|执行队伍|报这部分|持线性|据共享|据缓|推荐|操作中包|收时会造|数传|数据集|文档请|新反序列|方式获取|旅程|时会|时有一个|明为并|是同一|是拥|显著的特|替换目标|有关我|有点|期任务|期的观察|本文及案|束的|来看看多|析四留|果这个请|标及|样的关|次依|正在的|此整个|步消息查|毕则移除|法会|法的注解|注生命|流程上|消费与|源未回收|点执行对|片等等而|状态或|环的相互|现的|理生命周|用了保证|用到的如|用应注|用此链替|用系列完|由这些|的东西移|的关键|的基|的应用|的方式避|的此处以|的第一|的调|监听|直运|看收集|知道一般|码字中|码这里|种情|程包|程留|立保存欢|等一系列|算是否|篇留言|精确在|约束计|组件并|终止状|结果回调|统一|续轮询任|置更改如|者说获取|能不|自官|般地|获取初|行初|行深|表着与用|被调用时|要在的时|要被|观测也可|触发值更|记不同|设备后|试将工作|说你|调分发记|调用层次|象在|负责重新|赖在文件|跟踪|载及更|过反|还想|这种方式|迟时|送的消|通知处|道处理|部类需|里具体|量不足模|链目录目|闲置|队列的|随着源|</>|//|::|->|{}`.split("|");
      const DROPS = [];
      let dropsReady = false;

      function initDrops(){
        DROPS.length = 0;
        const n = Math.floor(W / 20);
        for(let i=0;i<n;i++){
          const seq = [];
          for(let k=0;k<16;k++) seq.push(TOKENS[Math.floor(Math.random()*TOKENS.length)]);
          DROPS.push({
            x: i*20 + (Math.random()-.5)*12,
            y: -(Math.random()*H),
            speed: Math.random()*2.2+1,
            len: Math.floor(Math.random()*10+6),
            seq,
            si: Math.floor(Math.random()*TOKENS.length),
            hue: Math.random()<.12?300:195,
          });
        }
        dropsReady = true;
      }

      function drawRain(){
        if(!dropsReady) return;
        ctx.font = '13px "Courier New",monospace';
        ctx.textBaseline = 'top';
        for(const d of DROPS){
          d.y += d.speed;
          if(d.y - d.len*16 > H + 60){ d.y = -(d.len*16 + Math.random()*H*.5); }
          for(let j=0;j<d.len;j++){
            const py = d.y - j*16;
            if(py < -20 || py > H+20) continue;
            const token = d.seq[(d.si + j) % d.seq.length];
            const t = j===0?1:Math.pow(.84,j);
            ctx.fillStyle = `hsla(${d.hue},92%,68%,${t})`;
            ctx.fillText(token, d.x, py);
          }
        }
      }

      /* ── Grid ── */
      function drawGrid(){
        const s=80, cx=W/2, cy=H*.47;
        ctx.strokeStyle='rgba(0,240,255,.025)'; ctx.lineWidth=.5; ctx.beginPath();
        for(let x=cx%s;x<W;x+=s){ctx.moveTo(x,0);ctx.lineTo(x,H)}
        for(let y=cy%s;y<H;y+=s){ctx.moveTo(0,y);ctx.lineTo(W,y)}
        ctx.stroke();
      }

      /* ── Loop ── */
      let lastT = 0;
      function frame(ts){
        const dt = lastT ? Math.min((ts-lastT)/1000,.1) : .016; lastT=ts;
        ctx.fillStyle='rgba(2,5,8,.18)'; ctx.fillRect(0,0,W,H);
        drawGrid();
        drawRain();
        tickOrbits(dt);
        requestAnimationFrame(frame);
      }

      function measure(){
        W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight;
        initDrops(); placeOrbits();
      }

      /* ── Orbits ── */
      const nodes=[];
      document.querySelectorAll('.node').forEach(el=>{
        const rVw=parseFloat(el.dataset.orbit)||24;
        const a0=(parseFloat(el.dataset.angle)||0)*Math.PI/180;
        const T=parseFloat(el.dataset.speed)||30;
        nodes.push({el,rv:rVw,angle:a0,spd:2*Math.PI/T});
      });

      function placeOrbits(){
        for(const n of nodes){
          const r=n.rv/100*W, x=Math.cos(n.angle)*r, y=Math.sin(n.angle)*r;
          n.el.style.transform=`translate(${x}px,${y}px)`;
        }
      }
      function tickOrbits(dt){
        for(const n of nodes){n.angle+=n.spd*dt}
        placeOrbits();
      }

      measure(); requestAnimationFrame(frame);
      window.addEventListener('resize', measure);
    })();
  </script>
</body>
</html>
