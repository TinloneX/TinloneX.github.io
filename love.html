<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Love | TinloneX</title>
  <meta name="description" content="一页粉色系温暖可爱的纪念页面，记录从 2025-01-30 15:48:00 开始的时间。">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Love | TinloneX">
  <meta property="og:description" content="一页粉色系温暖可爱的纪念页面，记录从 2025-01-30 15:48:00 开始的时间。">
  <meta property="og:image" content="https://tinlone.com/logo.jpg">
  <meta property="og:url" content="https://tinlone.com/love.html">
  <meta property="og:site_name" content="TinloneX">
  <meta property="og:locale" content="zh_CN">
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Love | TinloneX">
  <meta name="twitter:description" content="一页粉色系温暖可爱的纪念页面，记录从 2025-01-30 15:48:00 开始的时间。">
  <meta name="twitter:image" content="https://tinlone.com/logo.jpg">
  <!-- Canonical -->
  <link rel="canonical" href="https://tinlone.com/love.html">
    <link rel="stylesheet" href="/css/love.css">
</head>
<body>
  <div class="page">
    <div class="cloud one"></div>
    <div class="cloud two"></div>
    <div class="cloud three"></div>

    <div class="sparkle" style="top:11%;left:16%;animation-delay:-0.6s;"></div>
    <div class="sparkle" style="top:18%;left:73%;animation-delay:-1.8s;"></div>
    <div class="sparkle" style="top:30%;left:48%;animation-delay:-0.9s;"></div>
    <div class="sparkle" style="top:24%;left:88%;animation-delay:-2.6s;"></div>

    <div class="floating-heart" style="left:9%;bottom:18%;">❤</div>
    <div class="floating-heart" style="left:22%;bottom:10%;animation-delay:-2s;">❤</div>
    <div class="floating-heart" style="left:74%;bottom:16%;animation-delay:-4.4s;">❤</div>
    <div class="floating-heart" style="left:88%;bottom:11%;animation-delay:-1.1s;">❤</div>

    <main class="hero">
      <section class="hero-card">
        <p class="eyebrow">LOVE MEMORY</p>
        <h1 class="title">Our Sweet Time</h1>
        <p class="subtitle">
          这是一个柔软、温暖、带着一点甜意的纪念角落。
          两张珍贵的照片围着一颗怦然心动的爱心，
          这里静静记录着你们从那个时刻开始一起走过的时间。
        </p>

        <div class="love-stage">
          <figure class="photo-frame">
            <img
              id="left-photo-image"
              src="/b.jpg"
              data-remote-src="https://imgloc.com/image/OR9nHn"
              data-fallback-src="/b.jpg"
              alt="B">
            <figcaption class="photo-label">温柔小世界</figcaption>
          </figure>

          <div class="heart-zone">
            <div class="heart-shell" aria-hidden="true">
              <div class="heart-glow"></div>
              <div class="heart"></div>
            </div>
            <div class="heart-caption">一起把平凡的时间变成甜甜的日子</div>
          </div>

          <figure class="photo-frame right">
            <img
              id="right-photo-image"
              src="/g.jpg"
              data-remote-src="https://imgloc.com/image/OR92wL"
              data-fallback-src="/g.jpg"
              alt="G">
            <figcaption class="photo-label">可爱小宇宙</figcaption>
          </figure>
        </div>

        <div class="timer-card">
          <div class="timer-copy">
            <h2>从这一天开始</h2>
            <p>
              计时起点固定为 <strong>2025 年 1 月 30 日 15 时 48 分 0 秒</strong>。
              不管往后过了多少天、多少小时、多少秒，这份专属纪念都会安静地帮你们继续数下去。
            </p>
            <div class="start-time">2025-01-30 15:48:00</div>
          </div>

          <div class="timer-panel">
            <h2>已经一起走过</h2>
            <div class="timer-grid">
              <div class="timer-item">
                <strong id="days">0</strong>
                <span>DAYS</span>
              </div>
              <div class="timer-item">
                <strong id="hours">0</strong>
                <span>HOURS</span>
              </div>
              <div class="timer-item">
                <strong id="minutes">0</strong>
                <span>MINUTES</span>
              </div>
              <div class="timer-item">
                <strong id="seconds">0</strong>
                <span>SECONDS</span>
              </div>
            </div>
            <div class="seconds-line">总秒数：<span id="total-seconds">0</span></div>
          </div>
        </div>
      </section>
    </main>

    <div class="land" aria-hidden="true">
      <div class="hill back"></div>
      <div class="hill back right"></div>
      <div class="hill"></div>

      <div class="tree one">
        <div class="crown c1"></div>
        <div class="crown c2"></div>
        <div class="crown c3"></div>
        <div class="trunk"></div>
      </div>
      <div class="tree two">
        <div class="crown c1"></div>
        <div class="crown c2"></div>
        <div class="crown c3"></div>
        <div class="trunk"></div>
      </div>

      <div class="flower f1">
        <div class="bloom">
          <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="center"></div>
        </div>
        <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
      </div>
      <div class="flower f2">
        <div class="bloom">
          <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="center"></div>
        </div>
        <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
      </div>
      <div class="flower f3">
        <div class="bloom">
          <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="center"></div>
        </div>
        <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
      </div>
      <div class="flower f4">
        <div class="bloom">
          <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="center"></div>
        </div>
        <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
      </div>
      <div class="flower f5">
        <div class="bloom">
          <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="center"></div>
        </div>
        <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
      </div>
      <div class="flower f6">
        <div class="bloom">
          <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="center"></div>
        </div>
        <div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
      </div>

      <div class="cat peach">
        <div class="tail"></div><div class="body"></div><div class="paw left"></div><div class="paw right"></div>
        <div class="head"><div class="ear left"></div><div class="ear right"></div><div class="patch one"></div><div class="face"><div class="nose"></div></div><div class="bow"></div></div>
      </div>
      <div class="cat cream">
        <div class="tail"></div><div class="body"></div><div class="paw left"></div><div class="paw right"></div>
        <div class="head"><div class="ear left"></div><div class="ear right"></div><div class="patch one"></div><div class="face"><div class="nose"></div></div></div>
      </div>
      <div class="cat gray">
        <div class="tail"></div><div class="body"></div><div class="paw left"></div><div class="paw right"></div>
        <div class="head"><div class="ear left"></div><div class="ear right"></div><div class="patch one"></div><div class="face"><div class="nose"></div></div><div class="hat"></div></div>
      </div>
      <div class="cat orange">
        <div class="tail"></div><div class="body"></div><div class="paw left"></div><div class="paw right"></div>
        <div class="head"><div class="ear left"></div><div class="ear right"></div><div class="patch one"></div><div class="face"><div class="nose"></div></div></div>
      </div>
      <div class="cat white">
        <div class="tail"></div><div class="body"></div><div class="paw left"></div><div class="paw right"></div>
        <div class="head"><div class="ear left"></div><div class="ear right"></div><div class="patch one"></div><div class="face"><div class="nose"></div></div><div class="bow"></div></div>
      </div>
      <div class="cat milk-tea">
        <div class="tail"></div><div class="body"></div><div class="paw left"></div><div class="paw right"></div>
        <div class="head"><div class="ear left"></div><div class="ear right"></div><div class="patch one"></div><div class="face"><div class="nose"></div></div></div>
      </div>
      <div class="cat pink">
        <div class="tail"></div><div class="body"></div><div class="paw left"></div><div class="paw right"></div>
        <div class="head"><div class="ear left"></div><div class="ear right"></div><div class="patch one"></div><div class="face"><div class="nose"></div></div><div class="hat"></div></div>
      </div>
    </div>
  </div>

    <script defer src="/js/love.js"></script>
</body>
</html>
